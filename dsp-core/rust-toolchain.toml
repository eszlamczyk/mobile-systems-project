# Read by rustup only. Targets are installed automatically on first use.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",   # phones
    "x86_64-linux-android",    # emulator
    "aarch64-apple-ios",       # iPhone (links only on macOS)
    "aarch64-apple-ios-sim",   # iOS simulator on Apple Silicon
]
